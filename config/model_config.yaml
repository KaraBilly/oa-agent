# OA Agent 模型配置文件
# 版本: v3.0

# 默认模型设置
default_model:
  provider: xunfei
  model_name: spark-latest
  temperature: 0.7
  max_tokens: 1000

# 可用模型列表
models:
  - name: spark-latest
    provider: xunfei
    description: 科大讯飞星火模型（默认）
    enabled: true
    
  - name: spark-v3.5
    provider: xunfei
    description: 科大讯飞星火v3.5模型
    enabled: false
    
  - name: deepseek-chat
    provider: deepseek
    description: DeepSeek Chat模型
    enabled: false
    
  - name: deepseek-coder
    provider: deepseek
    description: DeepSeek Coder模型
    enabled: false
    
  - name: mock-v1
    provider: mock
    description: Mock模型，用于开发测试
    enabled: false
    
  - name: gpt-4
    provider: openai
    description: OpenAI GPT-4模型
    enabled: false
    
  - name: claude-3-opus
    provider: anthropic
    description: Anthropic Claude 3 Opus模型
    enabled: false

# 意图类型到模型的映射
intent_model_mapping:
  leave_request: spark-latest
  leave_query: spark-latest
  leave_withdraw: spark-latest
  other: spark-latest

# 模型优先级（当多个模型可用时）
model_priority:
  - spark-latest
  - spark-v3.5
  - deepseek-chat
  - mock-v1
  - gpt-4
  - claude-3-opus
  - gpt-3.5-turbo
